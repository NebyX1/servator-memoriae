# Override GPU: solo workers usan NVIDIA. El stack CPU arranca sin toolkit.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Requiere NVIDIA Container Toolkit en el host. Sin toolkit, usar solo
# docker-compose.yml (los workers CPU cubren transcribe/export/prepare_model).
services:
  paddle:
    build:
      additional_contexts:
        worker_base: service:worker-gpu
    environment:
      PADDLE_GPU_ENABLED: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-gpu:
    build:
      context: .
      dockerfile: ./worker/Dockerfile.gpu
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3mock:9090}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-servator}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_LOCAL: ${S3_USE_LOCAL:-1}
      DATA_DIR: /data
      MODEL_DIR: /models
      MODEL_CACHE_DIR: /models/cache
      DEVICE_MODE: cuda
      RQ_QUEUE: ${RQ_QUEUE:-servator}
      SECRET_KEY: ${SECRET_KEY}
      TORCH_DEVICE: cuda
    volumes:
      - servator-data:/data
      - model-cache:/models
    networks:
      - internal
      - outbound
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "/app/worker/run.py", "--queue", "${RQ_GPU_QUEUE:-servator-gpu}"]

  train-worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile.gpu
    restart: "no"
    profiles: ["train"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3mock:9090}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-servator}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_LOCAL: ${S3_USE_LOCAL:-1}
      DATA_DIR: /data
      MODEL_DIR: /models
      MODEL_CACHE_DIR: /models/cache
      DEVICE_MODE: cuda
      RQ_QUEUE: train
      SECRET_KEY: ${SECRET_KEY}
      TORCH_DEVICE: cuda
    volumes:
      - servator-data:/data
      - model-cache:/models
    networks:
      - internal
      - outbound
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "/app/worker/run.py", "--queue", "train"]
